version: '3.8'

x-airflow-common: &airflow-common
  image: airflow_with_spark # Mantenha o nome da sua imagem customizada do Airflow
  build:
    context: .
    dockerfile: Dockerfile.airflow # O seu Dockerfile para o Airflow
  networks:
    - sparkpg_network
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: '6kilTorrCF8qyiZMhAn5rL1IRYSG1kbcgf7l6Cnbnd0=' # Substitua por uma chave real. Ex: $(python -c "from cryptography.fernet import Fernet; FERNET_KEY = Fernet.generate_key().decode(); print(FERNET_KEY)")
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false' # Definido como false para não carregar exemplos por padrão
    AIRFLOW__CORE__TEST_CONNECTION: 'Enabled'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    # Configurações para MinIO
    AIRFLOW__S3__CONN_ID: minio_s3
    AIRFLOW__S3__ENDPOINT_URL: http://minio:9000
    AWS_ACCESS_KEY_ID: minioadmin # Seu usuário para o MinIO
    AWS_SECRET_ACCESS_KEY: minioadmin # Sua senha para o MinIO
  volumes:
    - .:/app
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:1000"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    airflow-postgres:
      condition: service_healthy
    minio: # Adicione a dependência no MinIO
      condition: service_healthy
    spark-master: # Adicione a dependência no Spark Master
      condition: service_healthy

networks:
  sparkpg_network:

services:
  spark-master:
    image: bitnami/spark:4.0.0
    container_name: spark-master
    networks:
      - sparkpg_network
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no" # Para desenvolvimento
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_MASTER_WEBUI_PORT: 8080
    ports:
      - "8081:8080" # UI do Master
      - "7077:7077" # Porta de comunicação do Master
    volumes:
      - spark-events:/opt/bitnami/spark/logs # O caminho dentro do contêiner bitnami pode variar, verifique a documentação
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -f http://localhost:8080"] # Verifica a UI
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  spark-worker:
    image: bitnami/spark:4.0.0
    container_name: spark-worker1
    networks:
      - sparkpg_network
    environment:
      SPARK_MODE: worker
      

      SPARK_MASTER_URL: spark://spark-master:7077 # Conecta ao master pelo nome do serviço
      SPARK_WORKER_CORES: 2 # Exemplo: 2 cores
      SPARK_WORKER_MEMORY: 2g # Exemplo: 2GB de RAM
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
    depends_on:
      - spark-master
    restart: always


  # Postgresql database instance (para sua aplicação, se houver)
  postgres:
    image: postgres:13
    restart: always

    networks:
      - sparkpg_network
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"

  # Website that can be used to connect, administrate and develop postgresql databases
  pgadmin:
    image: dpage/pgadmin4
    networks:
      - sparkpg_network
    environment:
      - PGADMIN_DEFAULT_EMAIL=root@root.com
      - PGADMIN_DEFAULT_PASSWORD=root
    ports:
      - "8050:80"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    container_name: minio
    networks:
      - sparkpg_network
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_SERVER_URL: http://minio:9000
    volumes:
      - minio_data:/data
    ports:
      - 9000:9000
      - 9001:9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    restart: always

  airflow-postgres:
      image: postgres:13
      networks:
        - sparkpg_network
      environment:
        POSTGRES_USER: airflow
        POSTGRES_PASSWORD: airflow
        POSTGRES_DB: airflow
      healthcheck:
        test: ["CMD", "pg_isready", "-U", "airflow"]
        interval: 10s
        retries: 5
        start_period: 5s
      restart: always

  redis:
      image: redis:7.2-bookworm
      networks:
          - sparkpg_network
      expose:
        - 6379
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 30s
        retries: 50
        start_period: 30s
      restart: always

  airflow-webserver:
      <<: *airflow-common
      command: webserver
      ports:
        - "8090:8080"
      healthcheck:
        test: ["CMD", "curl", "--fail", "http://localhost:8090/health"]
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 30s
      restart: always
      depends_on:
        <<: *airflow-common-depends-on
        airflow-init:
          condition: service_completed_successfully

  airflow-scheduler:
      <<: *airflow-common
      command: scheduler
      environment:
        HOME: /opt/airflow # Or /home/airflow, a path that exists in the container
      healthcheck:
        test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 30s
      restart: always
      depends_on:
        <<: *airflow-common-depends-on
        airflow-init:
          condition: service_completed_successfully

  airflow-worker:
      <<: *airflow-common
      command: celery worker
      healthcheck:
        test:
          - "CMD-SHELL"
          - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 30s
      environment:
        <<: *airflow-common-env
        HOME: /opt/airflow # Or /home/airflow, a path that exists in the container
        DUMB_INIT_SETSID: "0"
      restart: always
      depends_on:
        <<: *airflow-common-depends-on
        airflow-init:
          condition: service_completed_successfully

  airflow-triggerer:
      <<: *airflow-common
      command: triggerer
      healthcheck:
        test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 30s
      restart: always
      depends_on:
        <<: *airflow-common-depends-on
        airflow-init:
          condition: service_completed_successfully

  airflow-init:
      <<: *airflow-common
      entrypoint: /bin/bash
      command:
        - -c
        - |
          if [[ -z "${AIRFLOW_UID}" ]]; then
            echo
            echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
            echo "If you are on Linux, you SHOULD follow the instructions below to set "
            echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
            echo "For other operating systems you can get rid of the warning with manually created .env file:"
            echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
            echo
          fi
          one_meg=1048576
          mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
          cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
          disk_available=$$(df / | tail -1 | awk '{print $$4}')
          warning_resources="false"
          if (( mem_available < 4000 )) ; then
            echo
            echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
            echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
            echo
            warning_resources="true"
          fi
          if (( cpus_available < 2 )); then
            echo
            echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
            echo "At least 2 CPUs recommended. You have $${cpus_available}"
            echo
            warning_resources="true"
          fi
          if (( disk_available < one_meg * 10 )); then
            echo
            echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
            echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
            echo
            warning_resources="true"
          fi
          if [[ $${warning_resources} == "true" ]]; then
            echo
            echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
            echo "Please follow the instructions to increase amount of resources available:"
            echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
            echo
          fi
          mkdir -p /sources/logs /sources/dags /sources/plugins
          chown -R "${AIRFLOW_UID}:1000" /sources/{logs,dags,plugins}
          exec /entrypoint airflow version
      environment:
        <<: *airflow-common-env
        _AIRFLOW_DB_MIGRATE: 'true'
        _AIRFLOW_WWW_USER_CREATE: 'true'
        _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
        _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
        _PIP_ADDITIONAL_REQUIREMENTS: ''
      user: "0:0"
      volumes:
        - ${AIRFLOW_PROJ_DIR:-.}:/sources

  airflow-cli:
    <<: *airflow-common # <-- Add this line to include the common configuration
    environment:
        <<: *airflow-common-env
        CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - |
        airflow connections add 'spark_standalone_client' \
          --conn-json '{
              "conn_type": "spark",
              "host": "spark://spark-master",
              "port": 7077,
              "extra": {
                  "master_url": "spark://spark-master:7077"
              }
          }' && \
        airflow connections add 'minio_s3' \
          --conn-json '{
              "conn_type": "s3",
              "host": "http://minio:9000",
              "login": "minioadmin",
              "password": "minioadmin",
              "extra": {
                  "endpoint_url": "http://minio:9000",
                  "aws_access_key_id": "minioadmin",
                  "aws_secret_access_key": "minioadmin",
              }
          }' && \
        airflow db upgrade && \
        airflow users create \
          --username admin \
          --firstname Peter \
          --lastname Parker \
          --role Admin \
          --email spiderman@superhero.com \
          --password admin
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
volumes:
  spark-events:
  minio_data: